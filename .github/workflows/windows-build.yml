name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Version 3.0.15 -OutputDirectory .\dist

      - name: Run deterministic tests
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\dist\NetOptimizer-v3.0.15.exe).Path
          $tests = @(
            '--self-test',
            '--failover-simulation',
            '--diagnostics-test',
            '--ui-layout-test',
            '--gui-startup-test',
            '--update-check-test'
          )
          foreach ($test in $tests) {
            $process = Start-Process -FilePath $exe -ArgumentList $test -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) {
              throw "Test failed: $test (exit code $($process.ExitCode))"
            }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetOptimizer-v3.0.15-windows
          path: |
            dist/NetOptimizer-v3.0.15.exe
            dist/NetOptimizer-v3.0.15.pdb
